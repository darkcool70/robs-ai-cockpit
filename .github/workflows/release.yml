name: Release

# Push a tag like v0.1.0 to build the Windows installer and create a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      # With the PRO_REPO_TOKEN secret the private Pro code is checked out into ./pro and the
      # installer is the Pro edition; without it, the free open-source edition is built.
      HAS_PRO_TOKEN: ${{ secrets.PRO_REPO_TOKEN != '' }}
      ROBS_LICENSE_URL: ${{ vars.ROBS_LICENSE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Pro needs its license server
        if: env.HAS_PRO_TOKEN == 'true' && env.ROBS_LICENSE_URL == ''
        run: |
          echo "::error::PRO_REPO_TOKEN is set but the ROBS_LICENSE_URL variable is missing (docs/PRO.md)."
          exit 1

      - name: Edition
        run: echo "Building the ${{ env.HAS_PRO_TOKEN == 'true' && 'Pro' || 'free open-source' }} edition"

      - name: Check out Robs AI Cockpit Pro (private)
        if: env.HAS_PRO_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: darkcool70/robs-ai-cockpit-pro
          token: ${{ secrets.PRO_REPO_TOKEN }}
          path: pro

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Robs AI Cockpit ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/darkcool70/robs-ai-cockpit/blob/main/CHANGELOG.md) for what changed.

            **Install:** download `Robs AI Cockpit_*_x64-setup.exe` below and run it.
            The installer is not code-signed yet — Windows SmartScreen may warn: *More info → Run anyway*.

            Requires Windows 11 and at least one of the official CLIs (`claude`, `codex`) on your PATH.
          releaseDraft: true
          prerelease: false
          args: ${{ env.HAS_PRO_TOKEN == 'true' && '--features pro' || '' }}
