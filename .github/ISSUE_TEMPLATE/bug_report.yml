name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please remove personal data (paths, account names, prompts) from logs and screenshots.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Claude session in …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cockpit version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: clis
    attributes:
      label: CLI versions
      description: Output of `claude --version` and/or `codex --version`
  - type: input
    id: os
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: extra
    attributes:
      label: Screenshots / additional context
