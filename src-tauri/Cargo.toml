[package]
name = "ai-cockpit"
version = "0.4.1"
description = "Local-first control plane for official Claude Code and Codex CLI sessions"
authors = ["Robert Bansimer"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/darkcool70/robs-ai-cockpit"
homepage = "https://github.com/darkcool70/robs-ai-cockpit"
publish = false

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "ai_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
dirs = "7"
which = "8"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
walkdir = "2"
vt100 = "0.16.2"
cpal = "0.18.2"
ureq = "3.4.2"
sha2 = "0.11.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Pro edition only (license tokens): see docs/PRO.md
ed25519-dalek = { version = "2", optional = true }
# board: pictures from the web as data URLs
base64 = "0.22"
# Supertonic voices: ONNX Runtime loaded at run time from the cockpit's own pinned copy (no build-time download)
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "api-24"] }
unicode-normalization = "0.1"

[features]
# Robs AI Cockpit Pro: needs the private `pro/` checkout.
pro = ["dep:ed25519-dalek"]

[dev-dependencies]
tempfile = "3"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
png = "0.18"
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_Security_Cryptography"] }
